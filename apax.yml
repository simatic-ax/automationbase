# General information
name: "@simatic-ax/automationbase"
version: 0.0.0-placeholder
author: Siemens AG

# Description will be displayed in the apax extension
description: Foundation library for SIMATIC AX automation applications with equipment management, operating modes, error handling, automatic startup, and signal supervision
type: lib

#URL to the repository
repository:
  type: git
  url: https://github.com/simatic-ax/automation-base

# Targets which will be compiled with 'apax build'
targets:
  - "s7"
  - "llvm"

# Registry information, to other npm-registries where Apax packages are located
# '@scope': 'registry-url'
registries:
  '@simatic-ax': 'https://npm.pkg.github.com/'

# The public key to verify dependencies coming from the GitHub community. This ensures, that the package is
# not tampered with.
publicKeys:
  "@simatic-ax":
    "v1": "3792a7e926775425ccdd29ceed8c368c3008b5b33d7d5550b3cb1f58093e1dff"
    "v2": "7af3e394eb2b285a3d99ab8e1f745cc6db75704b30a80393339c721a92ffffd9"
# Dependencies
devDependencies:
  '@ax/sdk': ^2510.18.1
  "@ax/axunit-mocking": ^9.6.6
  "@simatic-ax/mocks": ^4.3.3

  "@simatic-ax/snippetscollection": ^1.1.0
  # Project variables
variables:
  APAX_BUILD_ARGS:
    - '--debug'

# Files, which will be shipped with the library
files:
  - 'README.md'
  - 'LICENSE.md'
  - 'docs'
  - 'bin/s7'
  - 'bin/llvm'
  - 'src'
  - 'snippets'

# Catalog to be installed
catalogs:
  "@ax/simatic-ax": ^2510.18.1
dependencies:
  "@ax/system-timer": ^10.4.66
  "@ax/simatic-clocks": ^11.0.116
  "@simatic-ax/io": ^11.0.0